name: Deploy to GitHub Pages

on:
  # 推送到 main 分支的 docs 目录时触发
  push:
    branches:
      - main
    paths:
      - 'docs/**'

  # 允许手动触发
  workflow_dispatch:

# 防止并发执行
concurrency:
  group: ai-daily-deploy
  cancel-in-progress: false

# 权限配置
permissions:
  contents: write

jobs:
  deploy:
    name: 部署到 GitHub Pages
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 检查 docs 目录
        run: |
          if [ ! -d "docs" ]; then
            echo "❌ 错误: docs 目录不存在"
            exit 1
          fi
          echo "✅ docs 目录检查通过"
          ls -lh docs/

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: '🚀 Deploy AI Daily from local'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: 部署完成
        run: |
          echo "✅ 部署完成"
          echo "🔗 https://maoruibin.github.io/ai-daily-skill/"
